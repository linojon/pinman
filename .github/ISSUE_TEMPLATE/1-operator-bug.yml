name: 🐞 Pinman Operator — bug report
description: Report a problem with Pinman Operator
labels: ["bug", "operator"]
title: "[Operator] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the fields below.

        > **This issue tracker is public** — anyone on the internet can read it.
        > Please leave out private or proprietary information (names, license keys,
        > business details, personal file paths — check screenshots and logs too).
        > If a detail matters to the bug but can't be public, omit it here and email
        > it to jonathan@pinmantech.com, mentioning the issue number.
  - type: input
    id: version
    attributes:
      label: Pinman Operator version
      description: Found in the app's About screen or the installer filename.
      placeholder: "1.3"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2, 64-bit"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Pinman Operator
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, or error messages
      description: Optional, but very helpful. Drag and drop images here. Please blur or crop anything private.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I've checked this report — including screenshots and logs — and it contains no private or proprietary information.
          required: true
